name: Refresh daily food feed

on:
  schedule:
    # 07:00 or 08:00 Sydney time, depending on daylight saving.
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/refresh-food-feed.mjs
      - name: Commit refreshed feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/data/viral-feed.json
          git diff --cached --quiet || git commit -m "chore: refresh daily food feed"
          git push
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload refreshed site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy refreshed site
        id: deployment
        uses: actions/deploy-pages@v4
